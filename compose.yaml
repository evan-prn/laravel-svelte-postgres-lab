# Nom du projet Compose : fixe les noms du conteneur et du volume, quel que soit le dossier du clone
name: laravel-svelte-postgres-lab

services:
  db:
    # Version épinglée (voir README) : jamais « latest »
    image: postgres:18.6-trixie
    environment:
      # Lus dans le .env à la racine, chargé automatiquement par Compose.
      # « :? » arrête Compose avec ce message si la variable manque, au lieu de démarrer à vide.
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE manquant, copier .env.example en .env}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME manquant, copier .env.example en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant, copier .env.example en .env}
    ports:
      # Publié sur 127.0.0.1 uniquement : la base n'est pas joignable depuis le réseau local
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # Depuis PostgreSQL 18, l'image attend le volume sur /var/lib/postgresql
      # (et non plus /var/lib/postgresql/data, qui ne persisterait rien)
      - pgdata:/var/lib/postgresql
    healthcheck:
      # « $$ » : la variable est lue dans le conteneur, pas remplacée par Compose
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  # Volume nommé, géré par Docker : les données survivent à « docker compose down »
  pgdata:
